<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px; background: #0e0e11; color: #d2d2da;
    font: 400 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 9px;
    padding: 13px 14px; border-bottom: 1px solid #17171c;
  }
  .mark { width: 20px; height: 20px; border-radius: 5px; background: #7c6cf5;
          display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; }
  .word { font-size: 12px; font-weight: 600; letter-spacing: .16em; color: #eeeef2; }
  .sec { padding: 14px; border-bottom: 1px solid #17171c; }
  .sec:last-of-type { border-bottom: none; }
  .lbl { font-size: 10px; letter-spacing: .11em; text-transform: uppercase;
         font-weight: 600; color: #6b6b78; margin-bottom: 7px; }
  button {
    width: 100%; border: none; border-radius: 8px; background: #7c6cf5; color: #fff;
    font: inherit; font-size: 13px; font-weight: 500; padding: 9px; cursor: pointer;
  }
  button:hover { background: #8f82f7; }
  button.ghost { background: #131317; border: 1px solid #23232b; color: #a8a8b5; margin-top: 10px; }
  button.ghost:hover { border-color: #2e2e38; color: #eeeef2; }
  .note { font-size: 11.5px; color: #6b6b78; margin-top: 9px; line-height: 1.5; }
  .ok { color: #58b58a; }
  .bad { color: #d4736b; }
  .warn { color: #d8a350; }
  .line { font-size: 12.5px; color: #a8a8b5; margin-top: 3px; }
  .line b { color: #eeeef2; font-weight: 500; }
  kbd { background: #131317; border: 1px solid #23232b; border-radius: 4px; padding: 0 5px; font: inherit; font-size: 11px; color: #d2d2da; }
</style>
</head>
<body>
  <header><div class="mark">S</div><div class="word">SCREENMATE</div></header>

  <div class="sec">
    <button id="open">Open on this page</button>
    <div class="note" id="health">Checking backend…</div>
  </div>

  <div class="sec">
    <div class="lbl">You</div>
    <div id="summary"></div>
    <div class="note warn" id="summaryWarn"></div>
    <button class="ghost" id="settings">Profile, resume &amp; settings</button>
    <div class="note"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> opens the panel on any page.</div>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
